<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Pemilih - E-Voting OSIS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-5">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">

            <div class="text-6xl mb-4">
                🗳️
            </div>

            <h1 class="text-3xl font-extrabold">
                Login Pemilih
            </h1>

            <p class="text-slate-500 mt-2">
                Silakan masukkan identitas Anda
            </p>

        </div>


        <div class="bg-white rounded-2xl shadow-xl p-7">

            <form id="loginForm">

                <!-- NAMA -->

                <div class="mb-5">

                    <label for="nama"
                           class="block font-semibold mb-2">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Contoh: Ahmad Rizky"
                        class="input-field"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- KELAS -->

                <div class="mb-6">

                    <label for="kelas"
                           class="block font-semibold mb-2">
                        Kelas
                    </label>

                    <select id="kelas"
                            class="input-field"
                            required>

                        <option value="">
                            -- Pilih Kelas --
                        </option>

                        <option value="X IPA 1">X IPA 1</option>
                        <option value="X IPA 2">X IPA 2</option>
                        <option value="X IPS 1">X IPS 1</option>
                        <option value="X IPS 2">X IPS 2</option>

                        <option value="XI IPA 1">XI IPA 1</option>
                        <option value="XI IPA 2">XI IPA 2</option>
                        <option value="XI IPS 1">XI IPS 1</option>
                        <option value="XI IPS 2">XI IPS 2</option>

                        <option value="XII IPA 1">XII IPA 1</option>
                        <option value="XII IPA 2">XII IPA 2</option>
                        <option value="XII IPS 1">XII IPS 1</option>
                        <option value="XII IPS 2">XII IPS 2</option>

                    </select>

                </div>


                <!-- ERROR -->

                <div id="loginError"
                     class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-5 text-sm">
                </div>


                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">

                    Lanjut ke Bilik Suara →

                </button>

            </form>


            <div class="mt-6 text-center">

                <a href="index.html"
                   class="text-blue-600 hover:underline text-sm">
                    ← Kembali ke Beranda
                </a>

            </div>

        </div>

    </div>


    <script src="data.js"></script>
    <script src="login.js"></script>

</body>
</html>

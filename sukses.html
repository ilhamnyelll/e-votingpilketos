<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voting Berhasil - E-Voting OSIS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-5">

    <div class="max-w-md w-full">

        <div class="bg-white rounded-3xl shadow-xl p-8 text-center">

            <div class="success-icon">
                ✓
            </div>

            <h1 class="text-3xl font-extrabold mt-6">
                Voting Berhasil!
            </h1>

            <p class="text-slate-500 mt-3">
                Terima kasih telah menggunakan hak pilih Anda.
            </p>


            <div class="bg-blue-50 rounded-xl p-5 mt-7">

                <p class="text-sm text-slate-500">
                    Pilihan Anda
                </p>

                <p id="successPaslon"
                   class="text-xl font-bold text-blue-700 mt-1">
                    -
                </p>

            </div>


            <div class="mt-7">

                <a href="index.html"
                   class="block bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">

                    Kembali ke Beranda

                </a>

            </div>

            <p class="text-xs text-slate-400 mt-6">
                Suara Anda telah tercatat dalam sistem.
            </p>

        </div>

    </div>


    <script src="js/data.js"></script>
    <script src="js/sukses.js"></script>

</body>
</html>
